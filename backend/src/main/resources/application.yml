server:
  port: 8080

spring:
  application:
    name: electricity-billing-system
  datasource:
    url: jdbc:sqlite:${user.dir}/data/ebs.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: false
        jdbc:
          batch_size: 20
    show-sql: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    root: INFO
    com.electricity.billing: DEBUG

app:
  cors:
    allowed-origins: http://localhost:4200
